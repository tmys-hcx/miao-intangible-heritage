server:
  port: 8044

spring:
  application:
    name: mic-goods #服务名
  cloud:
    nacos:
      config:
        import-check:
          enabled: false #未接入Nacos配置中心：禁用导入检查，否则启动报No spring.config.import错误
      discovery:
        server-addr: 127.0.0.1:8848 #nacos地址（已启动Nacos，启用服务注册发现）
    # OpenFeign远程调用：连接与读取超时收紧，避免远程服务异常时拖慢订单接口
    # （订单通知已改走 RabbitMQ 异步投递，此配置保留生效于后续其他 Feign 调用）
    openfeign:
      client:
        config:
          default:
            connect-timeout: 3000
            read-timeout: 5000
    # Sentinel 流控：启动即注册到控制台（dashboard），限流/熔断规则由 SentinelRuleConfig 代码内置加载（重启不丢失）
    sentinel:
      eager: true #启动即连接控制台（控制台未启动时仅打印连接警告，不影响限流熔断功能）
      transport:
        port: 9966 #与控制台通信端口（每个服务用不重复端口即可）
        dashboard: 127.0.0.1:9999 #sentinel控制台端口 启动sentinel控制台时指定

  servlet:
    multipart:
      # 文件上传大小限制，需与前端校验(4MB)保持一致并留有余量
      max-file-size: 10MB
      max-request-size: 10MB

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/miao_intangible_heritage?serverTimezone=Asia/Shanghai
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456} #本地演示库密码，实际部署请通过环境变量覆盖
    hikari:
      # 多服务共享远程库：收紧连接池，避免总连接数打满 max_connections（默认每服务 10 个常驻连接）
      maximum-pool-size: 5 # 单服务最大连接数
      minimum-idle: 1 # 最小空闲连接数（默认等于最大池大小，会常驻 10 个连接）
      connection-timeout: 5000 # 获取连接超时 5s（默认 30s，快速失败便于定位）
      idle-timeout: 60000 # 空闲连接 60s 后回收
      max-lifetime: 1800000 # 连接最长存活 30 分钟（避免复用服务端已关闭的死连接）

  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 2

  # RabbitMQ：订单通知异步投递（发送消息由 mic-notice 消费落库，不阻塞订单主流程）
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: /
    # 生产者确认：消息抵达交换机确认（correlated 支持带回调）/ 路由失败回退（returns），回调见 RabbitMqConfig
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true # 消息未路由到任何队列时回退（配合 returns 回调记录告警，便于发现队列未声明等问题）

#ribbon:
#  ConnectTimeout: 2000 # 请求连接的超时时间
#  ReadTimeout: 5000 # 请求处理的超时时间
#service-product: # 调用的提供者的名称
#  ribbon:
#    NFLoadBalancerRuleClassName: com.netflix.loadbalancer.RoundRobinRule

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.mic.goods.model.entity
  configuration:
    map-underscore-to-camel-case: true #下划线转驼峰
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl #打印sql日志

# Seata 分布式事务（TCC 模式）：下单创建开启全局事务，库存预留 StockTccAction 的 Try/Confirm/Cancel 由 TC 调度
# TC 为 docker 运行的 apache/seata-server:2.5.0，grouplist 直连单机（不依赖 seata-server 注册 Nacos）
seata:
  enabled: true
  application-id: mic-goods
  tx-service-group: mic_tx_group
  # 关闭 AT 自动数据源代理（starter 默认开启）：本服务只用 TCC 模式，无需 DataSourceProxy 代理 JDBC 连接，
  # 否则启动时强校验 AT 专属的 undo_log 表，缺失即报 in AT mode, undo_log table not exist 崩溃
  enable-auto-data-source-proxy: false
  service:
    vgroup-mapping:
      mic_tx_group: default
    grouplist:
      default: 127.0.0.1:8091 # seata-server TC 事务协议端口（docker 需映射 8091）
  tcc:
    fence:
      enable: true # TCC 三防：空回滚 / 悬挂 / 幂等由 tcc_fence_log 表保障

# Knife4j接口文档：访问 http://127.0.0.1:8044/doc.html
knife4j:
  enable: true
  setting:
    language: zh_cn